buildscript {
    repositories { 
        mavenCentral()
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.researchgate.release' version '2.8.1'
    id 'com.diffplug.spotless' version '5.16.0'
}

subprojects {

  apply plugin: 'java-library'
  apply plugin: 'maven-publish'
  apply plugin: 'com.diffplug.spotless'

  repositories {
      mavenCentral()
  }

  spotless {
    java {
      target 'src/**/*.java'
      googleJavaFormat()
    }
  } 

  nexusPublishing {
    repositories {
      sonatype()
    }
  }

  publishing {
    publications {
      mavenJava(MavenPublication) {
        if (project.name != "micronaut-e2e") {

            pom {
              groupId "io.activated.pipeline"
              artifactId "pipeline-${project.name}"
              name = "Pipeline ${project.name}"
              description = "Pipeline ${project.name}"
              url = 'https://activated.io/projects/reduction'
              licenses {
                license {
                  name = 'The Apache License, Version 2.0'
                  url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                }
              }

              developers {
                developer {
                  id = 'btomasini'
                  name = 'Ben Tomasini'
                  email = 'btomasini@activated.io'
                }
              }
              scm {
                connection = 'scm:git:git://github.com/activatedio/reduction.git'
                developerConnection = 'scm:git:git://github.com/activatedio/reduction.git'
                url = 'https://github.com/activatedio/reduction'
              }
            }

            from components.java
        }
      }
    }
  }

  java {
      sourceCompatibility = JavaVersion.toVersion("11")
      targetCompatibility = JavaVersion.toVersion("11")
  }

  dependencies {
      implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.30'
      implementation 'com.google.guava:guava:30.0-jre'
      testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.15.0'
      testImplementation group: 'org.mockito', name: 'mockito-core', version: '3.2.4'
      testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: '3.2.4'
      testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.6.0'
      testImplementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.3'
      testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.1'
      testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
  }

  release {
      afterReleaseBuild.dependsOn publish
  }

  signing {
      sign publishing.publications.mavenJava
  }

}

